[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "webscan-local"
version = "0.1.0"
description = "Local-first photo capture and Gaussian reconstruction studio"
requires-python = ">=3.11"
license = "MIT"
dependencies = [
  "fastapi>=0.115,<1", "uvicorn>=0.30,<1", "python-multipart>=0.0.20,<1",
  "pillow>=11,<13", "numpy>=2,<3", "torch>=2.6,<3", "pycolmap==3.13.0",
]

[project.optional-dependencies]
dev = ["pytest>=8,<10", "httpx>=0.27,<1"]
cuda = ["gsplat>=1.5,<2"]

[project.scripts]
webscan = "webscan.__main__:main"

[tool.setuptools.packages.find]
include = ["webscan*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
